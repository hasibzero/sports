<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M3U/M3U8 Player - Stream & Watch</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-play-circle"></i>
                    <span>StreamFlow</span>
                </div>
                <div class="header-actions">
                    <button class="btn-icon" id="settingsBtn" title="Settings">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Upload Section -->
            <section class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-content">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <h2>Drop M3U/M3U8 File Here</h2>
                        <p>or click to browse</p>
                        <input type="file" id="fileInput" accept=".m3u,.m3u8" hidden>
                    </div>
                </div>
                <div class="url-input-section">
                    <input type="text" id="urlInput" placeholder="Or paste M3U/M3U8 URL here" class="url-input">
                    <button class="btn-primary" id="loadUrlBtn">Load URL</button>
                </div>
            </section>

            <!-- Player Section -->
            <section class="player-section" id="playerSection" style="display: none;">
                <div class="player-container">
                    <!-- Video/Audio Player -->
                    <div class="player-display">
                        <video id="videoPlayer" class="video-player" controlsList="nodownload"></video>
                        <audio id="audioPlayer" class="audio-player"></audio>
                        <div class="now-playing" id="nowPlaying">
                            <div class="now-playing-content">
                                <div class="track-thumbnail">
                                    <i class="fas fa-music"></i>
                                </div>
                                <div class="track-details">
                                    <h3 id="nowPlayingTitle">No track selected</h3>
                                    <p id="nowPlayingArtist">Select a track from the playlist</p>
                                    <p id="nowPlayingDuration" class="duration">00:00</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Player Controls -->
                    <div class="player-controls">
                        <!-- Progress Bar -->
                        <div class="progress-container">
                            <span id="currentTime" class="time">00:00</span>
                            <div class="progress-bar-wrapper">
                                <div class="progress-bar" id="progressBar">
                                    <div class="progress-fill" id="progressFill"></div>
                                    <div class="progress-handle" id="progressHandle"></div>
                                </div>
                            </div>
                            <span id="duration" class="time">00:00</span>
                        </div>

                        <!-- Control Buttons -->
                        <div class="controls-buttons">
                            <button class="btn-icon" id="shuffleBtn" title="Shuffle">
                                <i class="fas fa-random"></i>
                            </button>
                            <button class="btn-icon" id="prevBtn" title="Previous">
                                <i class="fas fa-step-backward"></i>
                            </button>
                            <button class="btn-icon btn-play" id="playBtn" title="Play">
                                <i class="fas fa-play"></i>
                            </button>
                            <button class="btn-icon" id="nextBtn" title="Next">
                                <i class="fas fa-step-forward"></i>
                            </button>
                            <button class="btn-icon" id="repeatBtn" title="Repeat">
                                <i class="fas fa-redo"></i>
                            </button>
                            <div class="volume-control">
                                <i class="fas fa-volume-down"></i>
                                <input type="range" id="volumeSlider" min="0" max="100" value="70" class="volume-slider">
                                <i class="fas fa-volume-up"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Playlist Section -->
                <div class="playlist-section">
                    <div class="playlist-header">
                        <h2>Playlist</h2>
                        <div class="playlist-actions">
                            <input type="text" id="searchInput" placeholder="Search tracks..." class="search-input">
                            <button class="btn-icon" id="clearPlaylistBtn" title="Clear Playlist">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="playlist" id="playlist"></div>
                </div>
            </section>

            <!-- Empty State -->
            <section class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-content">
                    <i class="fas fa-inbox"></i>
                    <h2>No Playlist Loaded</h2>
                    <p>Upload a M3U/M3U8 file or provide a URL to get started</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-btn" id="closeSettings">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-item">
                    <label>Auto-play Next Track</label>
                    <div class="toggle-switch">
                        <input type="checkbox" id="autoPlayToggle" checked>
                        <span class="toggle-slider"></span>
                    </div>
                </div>
                <div class="setting-item">
                    <label>Theme</label>
                    <select id="themeSelect">
                        <option value="dark">Dark</option>
                        <option value="light">Light</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <script src="player.js"></script>
</body>
</html>
